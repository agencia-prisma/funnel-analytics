name: EPIC 12 Production Rollout Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/epic12-production-rollout-once.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  rollout-attribution:
    name: Rollout Attribution production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_USERNAME }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLICKHOUSE_URL CLICKHOUSE_USERNAME CLICKHOUSE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate EPIC 12 production configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "funnel-analytics-attribution-worker-production"' apps/attribution-worker/wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-attribution-production"' apps/attribution-worker/wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-attribution-dlq-production"' apps/attribution-worker/wrangler.jsonc
          grep -Fq '"dead_letter_queue": "funnel-analytics-attribution-dlq-production"' apps/attribution-worker/wrangler.jsonc
          grep -Fq '"binding": "ATTRIBUTION_QUEUE"' apps/commerce-worker/wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-attribution-production"' apps/commerce-worker/wrangler.jsonc
          test -f infra/clickhouse/migrations/0007_attribution_facts.sql

      - name: Apply ClickHouse migrations through 0007
        run: pnpm clickhouse:migrate

      - name: Ensure Attribution Queues exist
        shell: bash
        run: |
          set -euo pipefail
          queue_list="$(pnpm exec wrangler queues list)"
          printf '%s\n' "$queue_list"
          for queue in funnel-analytics-attribution-production funnel-analytics-attribution-dlq-production; do
            if ! printf '%s\n' "$queue_list" | grep -Fq "$queue"; then
              pnpm exec wrangler queues create "$queue"
            fi
          done

      - name: Create inactive Attribution Worker shell
        working-directory: apps/attribution-worker
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_source="$RUNNER_TEMP/attribution-bootstrap.ts"
          bootstrap_config="$RUNNER_TEMP/attribution-bootstrap.jsonc"
          printf '%s\n' 'export default { async fetch() { return new Response("inactive", { status: 503 }); } };' > "$bootstrap_source"
          printf '%s\n' \
            '{' \
            '  "name": "funnel-analytics-attribution-worker-production",' \
            "  \"main\": \"$bootstrap_source\"," \
            '  "compatibility_date": "2026-08-29",' \
            '  "workers_dev": false' \
            '}' > "$bootstrap_config"
          pnpm exec wrangler deploy --config "$bootstrap_config"

      - name: Configure Attribution ClickHouse secrets
        working-directory: apps/attribution-worker
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/attribution-secrets.json"
          bootstrap_config="$RUNNER_TEMP/attribution-bootstrap.jsonc"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const target = path.join(process.env.RUNNER_TEMP, "attribution-secrets.json");
            fs.writeFileSync(target, JSON.stringify({
              CLICKHOUSE_URL: process.env.CLICKHOUSE_URL,
              CLICKHOUSE_USERNAME: process.env.CLICKHOUSE_USERNAME,
              CLICKHOUSE_PASSWORD: process.env.CLICKHOUSE_PASSWORD
            }), { mode: 0o600 });
          '
          pnpm exec wrangler secret bulk "$secret_file" --config "$bootstrap_config"
          rm -f "$secret_file"

      - name: Confirm Attribution secret names
        working-directory: apps/attribution-worker
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$(pnpm exec wrangler secret list --env production)"
          printf '%s\n' "$secret_list"
          for name in CLICKHOUSE_URL CLICKHOUSE_USERNAME CLICKHOUSE_PASSWORD; do
            printf '%s\n' "$secret_list" | grep -Fq "\"name\": \"$name\""
          done

      - name: Deploy Attribution Worker production
        working-directory: apps/attribution-worker
        run: pnpm exec wrangler deploy --env production

      - name: Redeploy Commerce Worker with Attribution producer binding
        working-directory: apps/commerce-worker
        run: pnpm exec wrangler deploy --env production

      - name: Confirm deployments and Queue topology
        shell: bash
        run: |
          set -euo pipefail
          echo '===== Attribution deployment ====='
          (cd apps/attribution-worker && pnpm exec wrangler deployments list --env production)
          echo '===== Commerce deployment ====='
          (cd apps/commerce-worker && pnpm exec wrangler deployments list --env production)
          echo '===== Attribution Queue ====='
          pnpm exec wrangler queues info funnel-analytics-attribution-production
          echo '===== Attribution DLQ ====='
          pnpm exec wrangler queues info funnel-analytics-attribution-dlq-production
