name: EPIC 12 Cloudflare Final Validation Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/epic12-production-rollout-once.yml

permissions:
  contents: read

jobs:
  validate-attribution-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ATTRIBUTION_QUEUE_ID: 8a2e2bae49e344d295881ecc51b60f43
      ATTRIBUTION_DLQ_ID: b7a2e120b49c42ccb308a5fccbf16b0b

    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Read Attribution Queue topology and realtime backlog
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ATTRIBUTION_QUEUE_ID}" -H "$auth" -o /tmp/queue.json
          curl -fsS "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ATTRIBUTION_QUEUE_ID}/metrics" -H "$auth" -o /tmp/queue-metrics.json
          curl -fsS "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ATTRIBUTION_DLQ_ID}" -H "$auth" -o /tmp/dlq.json
          curl -fsS "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${ATTRIBUTION_DLQ_ID}/metrics" -H "$auth" -o /tmp/dlq-metrics.json

          node <<'NODE'
          const fs = require('node:fs');
          const queue = JSON.parse(fs.readFileSync('/tmp/queue.json', 'utf8'));
          const queueMetrics = JSON.parse(fs.readFileSync('/tmp/queue-metrics.json', 'utf8'));
          const dlq = JSON.parse(fs.readFileSync('/tmp/dlq.json', 'utf8'));
          const dlqMetrics = JSON.parse(fs.readFileSync('/tmp/dlq-metrics.json', 'utf8'));

          for (const [label, value] of Object.entries({queue, queueMetrics, dlq, dlqMetrics})) {
            if (!value.success) throw new Error(`${label} API request was not successful`);
          }

          const q = queue.result;
          const qm = queueMetrics.result;
          const d = dlq.result;
          const dm = dlqMetrics.result;

          const summary = {
            attribution_queue: {
              queue_id: q.queue_id,
              queue_name: q.queue_name,
              producers_total_count: q.producers_total_count,
              producers: q.producers,
              consumers_total_count: q.consumers_total_count,
              consumers: q.consumers,
              metrics: qm,
            },
            attribution_dlq: {
              queue_id: d.queue_id,
              queue_name: d.queue_name,
              producers_total_count: d.producers_total_count,
              producers: d.producers,
              consumers_total_count: d.consumers_total_count,
              metrics: dm,
            },
          };
          console.log(JSON.stringify(summary, null, 2));

          if (q.queue_name !== 'funnel-analytics-attribution-production') throw new Error('Wrong Attribution Queue');
          if (d.queue_name !== 'funnel-analytics-attribution-dlq-production') throw new Error('Wrong Attribution DLQ');
          if (q.producers_total_count !== 1 || q.producers?.[0]?.script !== 'funnel-analytics-commerce-worker-production') throw new Error('Commerce producer topology invalid');
          if (q.consumers_total_count !== 1 || q.consumers?.[0]?.script !== 'funnel-analytics-attribution-worker-production') throw new Error('Attribution consumer topology invalid');
          if (q.consumers?.[0]?.dead_letter_queue !== 'funnel-analytics-attribution-dlq-production') throw new Error('Attribution consumer DLQ topology invalid');
          if (d.producers_total_count !== 1 || d.producers?.[0]?.script !== 'funnel-analytics-attribution-worker-production') throw new Error('Attribution DLQ producer topology invalid');
          if (Number(qm.backlog_count) !== 0) throw new Error(`Attribution Queue backlog is ${qm.backlog_count}`);
          if (Number(dm.backlog_count) !== 0) throw new Error(`Attribution DLQ backlog is ${dm.backlog_count}`);
          NODE
