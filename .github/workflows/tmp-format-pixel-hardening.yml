name: Temporary Pixel Hardening Formatter

on:
  push:
    branches:
      - feature/pixel-public-key-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-public-key-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format hardening files
        run: |
          pnpm exec prettier --write \
            apps/collector/src/collector.ts \
            apps/collector/src/identify.ts \
            apps/collector/src/rate-limit.ts \
            apps/collector/src/rate-limit.test.ts \
            apps/collector/src/rate-limit-hardening.test.ts \
            apps/collector/src/router.test.ts \
            tests/pipeline/wrangler.jsonc \
            tests/sessionization/wrangler.jsonc \
            tests/identity/wrangler.jsonc
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/collector/src tests/pipeline/wrangler.jsonc tests/sessionization/wrangler.jsonc tests/identity/wrangler.jsonc
          git commit -m "chore: format pixel hardening changes"
          git push origin HEAD:feature/pixel-public-key-hardening
