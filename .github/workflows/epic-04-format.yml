name: EPIC 04 Format

on:
  push:
    branches:
      - feature/epic-04-event-collector

permissions:
  contents: write

concurrency:
  group: epic-04-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-04-event-collector

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Collector tests
        shell: bash
        run: |
          pnpm exec prettier --write             apps/collector/src/collector.test.ts             apps/collector/src/cors.test.ts             apps/collector/src/performance.test.ts             apps/collector/src/test-fixtures.ts             apps/collector/src/validation.test.ts             tests/collector/browser-integration.spec.ts

      - name: Commit formatted test files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/collector/src tests/collector
          git commit -m "style: format EPIC 04 tests"
          git push origin HEAD:feature/epic-04-event-collector
