name: Deploy Commerce Worker Production Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-commerce-worker-production-once.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy-commerce-worker:
    name: Deploy Commerce Worker production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_USERNAME }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLICKHOUSE_URL CLICKHOUSE_USERNAME CLICKHOUSE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production configuration and Queues
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "funnel-analytics-commerce-worker-production"' wrangler.jsonc
          grep -Fq '"COMMERCE_WORKER_ENV": "production"' wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-commerce-production"' wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-commerce-dlq-production"' wrangler.jsonc
          grep -Fq '"dead_letter_queue": "funnel-analytics-commerce-dlq-production"' wrangler.jsonc
          grep -Fq '"max_batch_size": 5' wrangler.jsonc
          grep -Fq '"max_retries": 3' wrangler.jsonc
          grep -Fq '"max_concurrency": 1' wrangler.jsonc

          queue_list="$(pnpm exec wrangler queues list)"
          printf '%s\n' "$queue_list" | grep -Fq 'funnel-analytics-commerce-production'
          printf '%s\n' "$queue_list" | grep -Fq 'funnel-analytics-commerce-dlq-production'

      - name: Create inactive Worker shell
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_source="$RUNNER_TEMP/commerce-bootstrap.ts"
          bootstrap_config="$RUNNER_TEMP/commerce-bootstrap.jsonc"

          printf '%s\n' 'export default { async fetch() { return new Response("inactive", { status: 503 }); } };' > "$bootstrap_source"
          printf '%s\n'             '{'             '  "name": "funnel-analytics-commerce-worker-production",'             "  \"main\": \"$bootstrap_source\","             '  "compatibility_date": "2026-08-29",'             '  "workers_dev": false'             '}' > "$bootstrap_config"

          pnpm exec wrangler deploy --config "$bootstrap_config"

      - name: Configure ClickHouse secrets
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/commerce-secrets.json"
          bootstrap_config="$RUNNER_TEMP/commerce-bootstrap.jsonc"

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const target = path.join(process.env.RUNNER_TEMP, "commerce-secrets.json");
            fs.writeFileSync(target, JSON.stringify({
              CLICKHOUSE_URL: process.env.CLICKHOUSE_URL,
              CLICKHOUSE_USERNAME: process.env.CLICKHOUSE_USERNAME,
              CLICKHOUSE_PASSWORD: process.env.CLICKHOUSE_PASSWORD
            }), { mode: 0o600 });
          '

          pnpm exec wrangler secret bulk "$secret_file" --config "$bootstrap_config"
          rm -f "$secret_file"

      - name: Confirm secret names before activation
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$(pnpm exec wrangler secret list --env production)"
          printf '%s\n' "$secret_list"
          for name in CLICKHOUSE_URL CLICKHOUSE_USERNAME CLICKHOUSE_PASSWORD; do
            printf '%s\n' "$secret_list" | grep -Fq "\"name\": \"$name\""
          done

      - name: Deploy Commerce Worker production
        working-directory: apps/commerce-worker
        run: pnpm exec wrangler deploy --env production

      - name: Confirm active deployment and bindings
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --env production
          pnpm exec wrangler queues info funnel-analytics-commerce-production
          pnpm exec wrangler queues info funnel-analytics-commerce-dlq-production
