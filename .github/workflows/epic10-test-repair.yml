name: EPIC 10 Test Repair

on:
  pull_request:
    paths:
      - '.github/workflows/epic10-test-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/epic-10-funnel-progression-conversion-facts'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Repair test typings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('packages/funnel-engine/src/index.test.ts')
          text = engine.read_text()
          text = text.replace('  FunnelProgressionError,\n', '')
          text = text.replace('.toMatchObject<FunnelProgressionError>(', '.toMatchObject(')
          engine.write_text(text)

          integration = Path('apps/funnel-worker/src/integration.test.ts')
          text = integration.read_text()
          text = text.replace(
              '    hits: string;\n    transitions: string;\n    conversions: string;',
              '    hits: number;\n    transitions: number;\n    conversions: number;',
          )
          text = text.replace(
              "{ hits: '3', transitions: '2', conversions: '1' }",
              '{ hits: 3, transitions: 2, conversions: 1 }',
          )
          text = text.replace(
              "{ hits: '2', transitions: '1', conversions: '0' }",
              '{ hits: 2, transitions: 1, conversions: 0 }',
          )
          text = text.replace(
              "{ hits: '0', transitions: '0', conversions: '0' }",
              '{ hits: 0, transitions: 0, conversions: 0 }',
          )
          integration.write_text(text)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repaired tests
        run: pnpm exec prettier --write packages/funnel-engine/src/index.test.ts apps/funnel-worker/src/integration.test.ts

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/funnel-engine/src/index.test.ts apps/funnel-worker/src/integration.test.ts
          git commit -m "test(epic10): align Vitest and ClickHouse result types"
          git push origin HEAD:"$GITHUB_HEAD_REF"
