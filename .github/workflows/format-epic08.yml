name: EPIC 08 Format Artifact

on:
  push:
    branches:
      - feature/epic-08-journey-engine

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format EPIC 08 files
        run: |
          pnpm exec prettier --write             .github/workflows/validation.yml             apps/identity-worker/src/journey-queue.ts             apps/identity-worker/wrangler.jsonc             apps/journey-worker             apps/session-worker/src/journey-queue.ts             apps/session-worker/wrangler.jsonc             packages/event-contracts/src/index.ts             packages/journey-engine
      - name: Bundle formatted files
        run: |
          tar -czf epic08-formatted.tar.gz             .github/workflows/validation.yml             apps/identity-worker/src/journey-queue.ts             apps/identity-worker/wrangler.jsonc             apps/journey-worker             apps/session-worker/src/journey-queue.ts             apps/session-worker/wrangler.jsonc             packages/event-contracts/src/index.ts             packages/journey-engine
      - uses: actions/upload-artifact@v4
        with:
          name: epic08-formatted
          path: epic08-formatted.tar.gz
