name: Format PR 36

on:
  push:
    branches:
      - feature/funnel-builder-simple-rules

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/funnel-builder-simple-rules
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/components/funnel-builder/RuleBuilder.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/funnel-builder/RuleBuilder.tsx
          git commit -m "style: format simplified rule builder"
          git push origin HEAD:feature/funnel-builder-simple-rules
