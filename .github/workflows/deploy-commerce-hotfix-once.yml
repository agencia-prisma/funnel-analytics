name: Deploy Commerce Hotfix Once

on:
  push:
    branches:
      - chore/epic11-commerce-hotfix-deploy-20260905
    paths:
      - .github/workflows/deploy-commerce-hotfix-once.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Commerce Worker production
        working-directory: apps/commerce-worker
        run: pnpm exec wrangler deploy --env production
      - name: Confirm deployment
        working-directory: apps/commerce-worker
        run: pnpm exec wrangler deployments list --env production
