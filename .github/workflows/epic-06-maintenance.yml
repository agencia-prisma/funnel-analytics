name: EPIC 06 Maintenance

on:
  push:
    branches:
      - feature/epic-06-sessionization

permissions:
  contents: write

concurrency:
  group: epic-06-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-06-sessionization

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Format EPIC 06 source
        run: |
          pnpm exec prettier --write             "package.json"             "apps/event-worker/package.json"             "apps/event-worker/README.md"             "apps/event-worker/src/**/*.{ts,json,jsonc}"             "apps/event-worker/wrangler.jsonc"             "apps/session-worker/**/*.{ts,json,jsonc,md}"             "packages/clickhouse/src/**/*.{ts,json,jsonc}"             "packages/event-contracts/src/**/*.ts"             "packages/session-engine/**/*.{ts,json,jsonc,md}"             "tests/pipeline/**/*.{ts,json,jsonc}"             "tests/sessionization/**/*.{ts,json,jsonc}"             "playwright.sessionization.config.ts"             "docs/sessionization.md"

      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             pnpm-lock.yaml             package.json             apps/event-worker             apps/session-worker             packages/clickhouse             packages/event-contracts             packages/session-engine             tests/pipeline             tests/sessionization             playwright.sessionization.config.ts             docs/sessionization.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize EPIC 06 lockfile and formatting"
          git push origin HEAD:feature/epic-06-sessionization
