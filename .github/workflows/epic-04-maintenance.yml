name: EPIC 04 Maintenance

on:
  push:
    branches:
      - feature/epic-04-event-collector

permissions:
  contents: write

concurrency:
  group: epic-04-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-04-event-collector

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Format EPIC 04 files
        shell: bash
        run: |
          pnpm exec prettier --write             package.json             pnpm-lock.yaml             packages/event-contracts/src/index.ts             packages/pixel/package.json             packages/pixel/src/config.ts             packages/pixel/src/properties.ts             packages/pixel/src/transport.ts             packages/pixel/src/transport.test.ts             apps/collector             docs/event-collector.md             playwright.collector.config.ts             tests/collector

      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml packages/event-contracts packages/pixel apps/collector docs/event-collector.md playwright.collector.config.ts tests/collector
          git commit -m "chore: normalize EPIC 04 lockfile and formatting"
          git push origin HEAD:feature/epic-04-event-collector
