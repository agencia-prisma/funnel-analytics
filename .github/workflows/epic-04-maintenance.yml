name: EPIC 04 Maintenance

on:
  push:
    branches:
      - feature/epic-04-event-collector

permissions:
  contents: write

concurrency:
  group: epic-04-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-04-event-collector

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Format source
        run: pnpm format

      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json .gitignore apps/collector packages/event-contracts packages/pixel docs/event-collector.md playwright.collector.config.ts tests/collector
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize EPIC 04 lockfile and formatting"
          git push origin HEAD:feature/epic-04-event-collector
