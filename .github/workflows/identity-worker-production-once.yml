name: Identity Worker Production Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/identity-worker-production-once.yml

permissions:
  contents: read

jobs:
  identity-worker-production:
    name: Identity Worker production deploy and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Identity Worker production configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"SUPABASE_URL": "https://efkqeqaispyppxnjlobi.supabase.co"' apps/identity-worker/wrangler.jsonc
          echo "Production Identity Worker SUPABASE_URL is declared in wrangler.jsonc."

      - name: Validate Identity Worker production secret names
        working-directory: apps/identity-worker
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST="$(pnpm exec wrangler secret list --env production)"
          printf '%s\n' "$SECRET_LIST"

          missing=0
          for name in \
            SUPABASE_SECRET_KEY \
            CLICKHOUSE_URL \
            CLICKHOUSE_USERNAME \
            CLICKHOUSE_PASSWORD
          do
            if ! printf '%s\n' "$SECRET_LIST" | grep -Fq "\"name\": \"$name\""; then
              echo "::error::Missing production Identity Worker secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy production Identity Worker
        working-directory: apps/identity-worker
        run: pnpm exec wrangler deploy --env production

      - name: Trigger identity smoke through Collector
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://funnel-analytics-collector-production.prismaag.workers.dev'
          ORIGIN='https://lp.prismaag.com.br'
          PIXEL_KEY='px_pub_5a53e35861b97c4584f39d5c670d03b99bda'
          VISITOR_ID='00000000-0000-7000-8000-000000000008'
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          PAYLOAD=$(cat <<JSON
          {
            "identify_version": 1,
            "pixel_key": "$PIXEL_KEY",
            "visitor_id": "$VISITOR_ID",
            "session_id": null,
            "occurred_at": "$NOW",
            "identifiers": {
              "email": "identity-worker-production-smoke@example.com"
            },
            "consent_state": "granted",
            "sdk_version": "github-actions-identity-worker/1.0",
            "test_mode": true
          }
          JSON
          )

          rm -f /tmp/headers /tmp/body
          status="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' \
            -X POST "$BASE/v1/identify" \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            --data "$PAYLOAD")"

          cat /tmp/headers
          echo "HTTP_STATUS=$status"
          cat /tmp/body
          echo
          echo "SMOKE_VISITOR_ID=$VISITOR_ID"

          if [ "$status" != '202' ]; then
            echo "::error::Identity smoke expected HTTP 202 but received $status"
            exit 1
          fi

          sleep 10
