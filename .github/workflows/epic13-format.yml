name: EPIC 13 Format

on:
  push:
    branches:
      - feature/epic-13-funnel-builder

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epic-13-funnel-builder
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format EPIC 13 files
        run: >-
          pnpm exec prettier --write
          "apps/web/app/app/funnels/**/*.tsx"
          "apps/web/app/app/funnels/**/*.ts"
          "apps/web/components/funnel-builder/**/*.{ts,tsx}"
          "tests/e2e/funnel-builder.spec.ts"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/funnels apps/web/components/funnel-builder tests/e2e/funnel-builder.spec.ts
          git commit -m "style(epic13): apply prettier"
          git pull --rebase origin feature/epic-13-funnel-builder
          git push origin HEAD:feature/epic-13-funnel-builder
