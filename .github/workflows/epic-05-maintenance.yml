name: EPIC 05 Maintenance

on:
  push:
    branches:
      - feature/epic-05-event-pipeline

permissions:
  contents: write

concurrency:
  group: epic-05-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-05-event-pipeline

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Format
        run: pnpm format

      - name: Commit normalized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize EPIC 05 lockfile and formatting"
          git push origin HEAD:feature/epic-05-event-pipeline
