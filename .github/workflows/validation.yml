name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase
        run: pnpm supabase start

      - name: Run database tests
        run: pnpm supabase test db

      - name: Stop isolated Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  e2e:
    name: Auth E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated Supabase
        run: pnpm supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Run E2E
        run: pnpm test:e2e

      - name: Stop isolated Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  pixel-sdk:
    name: Pixel SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Pixel unit tests
        run: pnpm --filter @funnel/pixel test

      - name: Check Pixel bundle size
        run: pnpm --filter @funnel/pixel check:size

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pixel browser tests
        run: pnpm test:pixel-browser

  collector:
    name: Collector
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Collector typecheck
        run: pnpm --filter @funnel/collector typecheck

      - name: Collector unit tests
        run: pnpm --filter @funnel/collector test

      - name: Worker build
        run: pnpm --filter @funnel/collector build

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare local Collector environment
        run: cp apps/collector/.dev.vars.example apps/collector/.dev.vars

      - name: Start local Cloudflare Worker
        shell: bash
        run: |
          pnpm collector:dev > /tmp/collector.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/collector.log
          exit 1

      - name: Browser to Collector integration
        run: pnpm test:collector-browser

      - name: Show Collector logs on failure
        if: failure()
        run: cat /tmp/collector.log || true
