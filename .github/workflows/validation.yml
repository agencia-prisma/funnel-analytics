name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply EPIC 07 formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/epic-07-identity-foundation'
        shell: bash
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(identity): apply prettier formatting"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase
        run: bash scripts/ci/start-supabase.sh

      - name: Run database tests
        run: pnpm supabase test db

      - name: Stop isolated Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  e2e:
    name: Auth E2E
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated Supabase
        run: bash scripts/ci/start-supabase.sh

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(pnpm supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Run E2E
        run: pnpm test:e2e

      - name: Stop isolated Supabase
        if: always()
        run: pnpm supabase stop --no-backup

  pixel-sdk:
    name: Pixel SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Pixel unit tests
        run: pnpm --filter @funnel/pixel test

      - name: Check Pixel bundle size
        run: pnpm --filter @funnel/pixel check:size

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pixel browser tests
        run: pnpm test:pixel-browser

  collector:
    name: Collector
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Collector typecheck
        run: pnpm --filter @funnel/collector typecheck

      - name: Collector unit tests
        run: pnpm --filter @funnel/collector test

      - name: Worker build
        run: pnpm --filter @funnel/collector build

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare local Collector environment
        run: cp apps/collector/.dev.vars.example apps/collector/.dev.vars

      - name: Start local Cloudflare Worker
        shell: bash
        run: |
          pnpm collector:dev > /tmp/collector.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/collector.log
          exit 1

      - name: Start browser fixture server
        shell: bash
        run: |
          node tests/collector/fixture-server.mjs > /tmp/fixture.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixture.log
          exit 1

      - name: Browser to Collector integration
        run: pnpm test:collector-browser

      - name: Show Collector logs on failure
        if: failure()
        run: cat /tmp/collector.log || true

  event-pipeline:
    name: Event Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: test-password

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10
        env:
          CLICKHOUSE_PASSWORD: test-password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password test-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Event Worker typecheck
        run: pnpm --filter @funnel/event-worker typecheck

      - name: ClickHouse package typecheck
        run: pnpm --filter @funnel/clickhouse typecheck

      - name: Event Worker unit tests
        run: pnpm --filter @funnel/event-worker test

      - name: ClickHouse unit tests
        run: pnpm --filter @funnel/clickhouse test

      - name: Event Worker build
        run: pnpm --filter @funnel/event-worker build

      - name: Apply ClickHouse test schema
        run: pnpm clickhouse:migrate

      - name: ClickHouse integration and dedup
        run: pnpm --filter @funnel/clickhouse test:integration

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare local pipeline secrets
        shell: bash
        run: |
          cp tests/pipeline/.dev.vars.example tests/pipeline/.dev.vars
          sed -i 's/REPLACE_LOCAL_TEST_PASSWORD/test-password/' tests/pipeline/.dev.vars

      - name: Start local Cloudflare pipeline
        shell: bash
        run: |
          pnpm --filter @funnel/event-worker exec wrangler dev --config "$GITHUB_WORKSPACE/tests/pipeline/wrangler.jsonc" --local --ip 127.0.0.1 --port 8790 --env-file "$GITHUB_WORKSPACE/tests/pipeline/.dev.vars" > /tmp/pipeline.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8790/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pipeline.log
          exit 1

      - name: Start browser fixture server
        shell: bash
        run: |
          node tests/collector/fixture-server.mjs > /tmp/fixture.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixture.log
          exit 1

      - name: Full browser event pipeline
        run: pnpm test:pipeline-browser

      - name: Show pipeline logs on failure
        if: failure()
        run: cat /tmp/pipeline.log || true

  sessionization:
    name: Sessionization
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: test-password

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10
        env:
          CLICKHOUSE_PASSWORD: test-password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password test-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Session Engine typecheck
        run: pnpm --filter @funnel/session-engine typecheck

      - name: Session Worker typecheck
        run: pnpm --filter @funnel/session-worker typecheck

      - name: Event Worker typecheck
        run: pnpm --filter @funnel/event-worker typecheck

      - name: Session Engine unit tests
        run: pnpm --filter @funnel/session-engine test

      - name: Sessionization performance smoke
        run: pnpm --filter @funnel/session-engine test:performance

      - name: Session Worker tests
        run: pnpm --filter @funnel/session-worker test

      - name: Event Worker session queue tests
        run: pnpm --filter @funnel/event-worker test

      - name: Session Worker dry-run build
        run: pnpm --filter @funnel/session-worker build

      - name: Apply ClickHouse migrations 0001 + 0002
        run: pnpm clickhouse:migrate

      - name: Session ClickHouse integration
        run: pnpm --filter @funnel/session-engine test:integration

      - name: Build Pixel SDK
        run: pnpm --filter @funnel/pixel build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare local sessionization secrets
        shell: bash
        run: |
          cp tests/sessionization/.dev.vars.example tests/sessionization/.dev.vars
          sed -i 's/REPLACE_LOCAL_TEST_PASSWORD/test-password/' tests/sessionization/.dev.vars

      - name: Start local Cloudflare sessionization pipeline
        shell: bash
        run: |
          pnpm --filter @funnel/session-worker exec wrangler dev --config "$GITHUB_WORKSPACE/tests/sessionization/wrangler.jsonc" --local --ip 127.0.0.1 --port 8791 --env-file "$GITHUB_WORKSPACE/tests/sessionization/.dev.vars" > /tmp/sessionization.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8791/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sessionization.log
          exit 1

      - name: Start browser fixture server
        shell: bash
        run: |
          node tests/collector/fixture-server.mjs > /tmp/fixture.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixture.log
          exit 1

      - name: Full browser sessionization
        run: pnpm test:sessionization-browser

      - name: Show sessionization logs on failure
        if: failure()
        run: cat /tmp/sessionization.log || true

  identity-foundation:
    name: Identity Foundation
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: test-password

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10
        env:
          CLICKHOUSE_PASSWORD: test-password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password test-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Identity package typecheck
        run: pnpm --filter @funnel/identity typecheck

      - name: Identity crypto and normalization tests
        run: pnpm --filter @funnel/identity test

      - name: Collector identity typecheck
        run: pnpm --filter @funnel/collector typecheck

      - name: Collector identity tests
        run: pnpm --filter @funnel/collector test

      - name: Identity Worker typecheck
        run: pnpm --filter @funnel/identity-worker typecheck

      - name: Identity Worker tests
        run: pnpm --filter @funnel/identity-worker test

      - name: Identity Worker dry-run build
        run: pnpm --filter @funnel/identity-worker build

      - name: ClickHouse package typecheck
        run: pnpm --filter @funnel/clickhouse typecheck

      - name: Apply ClickHouse migrations 0001 + 0002 + 0003
        run: pnpm clickhouse:migrate

      - name: ClickHouse identity links integration
        run: pnpm --filter @funnel/clickhouse test:identity-integration
