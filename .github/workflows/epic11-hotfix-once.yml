name: EPIC 11 Commerce Event Name Hotfix Once

on:
  push:
    branches:
      - fix/epic11-commerce-normalized-event-names
    paths:
      - .github/workflows/epic11-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epic11-commerce-normalized-event-names
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch normalized commerce event names and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('packages/commerce-engine/src/index.ts')
          text = source.read_text()
          old = """function commerceName(\n  event: CommerceSourceEventV1,\n): CommerceEventNameV1 | null {\n  const candidate =\n    event.event_name === 'purchase'\n      ? 'purchase'\n      : event.event_name === 'custom_event'\n        ? event.custom_event_name\n        : null;\n\n  return candidate === 'checkout_started' ||\n    candidate === 'purchase' ||\n    candidate === 'refund' ||\n    candidate === 'order_cancelled'\n    ? candidate\n    : null;\n}\n"""
          new = """function isCommerceEventName(\n  value: string | null,\n): value is CommerceEventNameV1 {\n  return (\n    value === 'checkout_started' ||\n    value === 'purchase' ||\n    value === 'refund' ||\n    value === 'order_cancelled'\n  );\n}\n\nfunction commerceName(\n  event: CommerceSourceEventV1,\n): CommerceEventNameV1 | null {\n  if (isCommerceEventName(event.event_name)) {\n    return event.event_name;\n  }\n\n  return event.event_name === 'custom_event' &&\n    isCommerceEventName(event.custom_event_name)\n    ? event.custom_event_name\n    : null;\n}\n"""
          if old not in text:
              raise SystemExit('commerceName target block not found')
          source.write_text(text.replace(old, new, 1))

          tests = Path('packages/commerce-engine/src/index.test.ts')
          test_text = tests.read_text()
          marker = '\n});\n'
          idx = test_text.rfind(marker)
          if idx == -1:
              raise SystemExit('test suite closing marker not found')
          regression = r'''

  it('accepts normalized commerce event names persisted by the event pipeline', () => {
    const normalized = (
      id: string,
      at: string,
      name: 'checkout_started' | 'purchase' | 'refund' | 'order_cancelled',
      properties: Record<string, unknown>,
    ) => ({
      ...event({ id, at, name, properties }),
      event_name: name,
      custom_event_name: name,
    });

    const result = evaluateCommerce({
      ...base,
      events: [
        normalized(
          '71000000-0000-4000-8000-000000000151',
          '2026-09-05T10:00:00.000Z',
          'checkout_started',
          {
            checkout_id: 'checkout-normalized',
            provider: 'custom',
            currency: 'BRL',
            value_minor: 10000,
          },
        ),
        normalized(
          '71000000-0000-4000-8000-000000000152',
          '2026-09-05T10:01:00.000Z',
          'purchase',
          {
            provider: 'custom',
            order_id: 'order-normalized',
            currency: 'BRL',
            value_minor: 10000,
          },
        ),
        normalized(
          '71000000-0000-4000-8000-000000000153',
          '2026-09-05T10:02:00.000Z',
          'refund',
          {
            provider: 'custom',
            order_id: 'order-normalized',
            currency: 'BRL',
            refund_minor: 2500,
          },
        ),
        normalized(
          '71000000-0000-4000-8000-000000000154',
          '2026-09-05T10:03:00.000Z',
          'order_cancelled',
          {
            provider: 'custom',
            order_id: 'order-normalized',
          },
        ),
      ],
    });

    expect(result.checkouts).toHaveLength(1);
    expect(result.revenue).toEqual([
      expect.objectContaining({
        order_id: 'order-normalized',
        status: 'cancelled',
        refunded_amount_minor: 2500,
        net_amount_minor: 7500,
      }),
    ]);
  });
'''
          tests.write_text(test_text[:idx] + regression + test_text[idx:])
          PY
      - run: pnpm exec prettier --write packages/commerce-engine/src/index.ts packages/commerce-engine/src/index.test.ts
      - run: pnpm --filter @funnel/commerce-engine typecheck
      - run: pnpm --filter @funnel/commerce-engine test
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/commerce-engine/src/index.ts packages/commerce-engine/src/index.test.ts
          git commit -m 'fix(commerce): accept normalized commerce event names'
          git push origin HEAD:fix/epic11-commerce-normalized-event-names
