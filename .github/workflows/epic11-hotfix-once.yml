name: EPIC 11 Commerce Hotfix Once

on:
  push:
    branches:
      - fix/epic11-commerce-normalized-event-names
    paths:
      - .github/workflows/epic11-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epic11-commerce-normalized-event-names
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 .github/epic11-hotfix.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/commerce-engine/src/index.ts packages/commerce-engine/src/index.test.ts
          git commit -m 'fix(commerce): accept normalized commerce event names'
          git push origin HEAD:fix/epic11-commerce-normalized-event-names
