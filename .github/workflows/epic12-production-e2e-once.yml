name: EPIC 12 Production Attribution E2E Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/epic12-production-e2e-once.yml

permissions:
  contents: read

jobs:
  attributed-refund:
    runs-on: ubuntu-latest
    steps:
      - name: Send partial refund to production Collector
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://funnel-analytics-collector-production.prismaag.workers.dev/v1/events';
          const now = new Date().toISOString();
          const event = {
            event_version: 1,
            sdk_version: 'epic12-e2e/1.0.0',
            event_id: '02b08112-1117-7a01-8a01-111111111117',
            pixel_key: 'px_pub_5a53e35861b97c4584f39d5c670d03b99bda',
            visitor_id: '02b08112-1111-7a01-8a01-111111111111',
            session_id: '02b08112-1114-7a01-8a01-111111111114',
            event_name: 'custom_event',
            custom_event_name: 'refund',
            occurred_at: now,
            page_url: 'https://lp.prismaag.com.br/epic12-attribution-e2e',
            page_path: '/epic12-attribution-e2e',
            page_title: 'EPIC 12 Attribution E2E',
            referrer: null,
            referrer_domain: null,
            utm_source: null,
            utm_medium: null,
            utm_campaign: null,
            utm_content: null,
            utm_term: null,
            click_ids: {},
            device: { type: 'desktop' },
            browser: { name: 'GitHub Actions' },
            os: { name: 'Linux' },
            screen: { width: 1920, height: 1080, device_pixel_ratio: 1 },
            viewport: { width: 1280, height: 720 },
            language: 'pt-BR',
            timezone: 'America/Sao_Paulo',
            consent_state: 'granted',
            test_mode: true,
            properties: {
              provider: 'custom',
              order_id: 'epic12-e2e-20260905-001',
              currency: 'BRL',
              refund_minor: 3000
            }
          };
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: 'https://lp.prismaag.com.br' },
            body: JSON.stringify({ batch_version: 1, sent_at: now, events: [event] }),
          });
          const text = await response.text();
          console.log(`HTTP ${response.status}`);
          console.log(text);
          if (response.status !== 202) process.exit(1);
          NODE
