name: EPIC 09 Format Sync

on:
  pull_request:
    paths:
      - 'packages/rule-engine/**'
      - 'supabase/migrations/**funnel**'
      - 'supabase/tests/**funnel**'
      - 'docs/funnel-definition-rule-engine.md'
      - 'docs/migrations-epic09.md'
      - 'docs/decisions/0004-funnel-definition-versioning.md'
      - '.github/workflows/funnel-definition-rule-engine.yml'
      - '.github/workflows/epic09-format-sync.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/epic-09-funnel-definition-rule-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit formatting if changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(epic09): apply repository formatting"
          git push origin HEAD:"$GITHUB_HEAD_REF"
