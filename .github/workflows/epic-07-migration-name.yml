name: EPIC 07 Migration Name

on:
  push:
    branches:
      - feature/epic-07-identity-foundation

permissions:
  contents: write

jobs:
  create-migration:
    if: "!contains(github.event.head_commit.message, 'create identity foundation migration')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epic-07-identity-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase CLI package only
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create migration using Supabase CLI
        run: pnpm supabase migration new identity_foundation
      - name: Commit migration name
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: create identity foundation migration"
          git push origin HEAD:feature/epic-07-identity-foundation
