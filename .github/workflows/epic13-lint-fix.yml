name: EPIC 13 Lint Fix

on:
  push:
    branches:
      - feature/epic-13-funnel-builder

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epic-13-funnel-builder
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply React 19 lint-safe history state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/components/funnel-builder/FunnelBuilder.tsx')
          s = p.read_text()
          s = s.replace("import { useEffect, useMemo, useRef, useState, useTransition } from 'react';", "import { useEffect, useMemo, useState, useTransition } from 'react';")
          s = s.replace("  const undoStack = useRef<BuilderDraft[]>([]);\n  const redoStack = useRef<BuilderDraft[]>([]);", "  const [undoStack, setUndoStack] = useState<BuilderDraft[]>([]);\n  const [redoStack, setRedoStack] = useState<BuilderDraft[]>([]);")
          old_effect = '''  useEffect(() => {\n    try {\n      const stored = window.localStorage.getItem(storageKey);\n      if (!stored) return;\n      const candidate = JSON.parse(stored) as BuilderDraft;\n      if (\n        candidate &&\n        Array.isArray(candidate.steps) &&\n        candidate.baseVersion === currentVersion &&\n        candidate.funnelId === funnelId\n      ) {\n        setDraft(candidate);\n        setSelectedStepId(candidate.steps[0]?.id ?? null);\n        setMessage('Rascunho local restaurado.');\n      }\n    } catch {\n      window.localStorage.removeItem(storageKey);\n    }\n  }, [currentVersion, funnelId, storageKey]);'''
          new_effect = '''  useEffect(() => {\n    const restoreTimer = window.setTimeout(() => {\n      try {\n        const stored = window.localStorage.getItem(storageKey);\n        if (!stored) return;\n        const candidate = JSON.parse(stored) as BuilderDraft;\n        if (\n          candidate &&\n          Array.isArray(candidate.steps) &&\n          candidate.baseVersion === currentVersion &&\n          candidate.funnelId === funnelId\n        ) {\n          setDraft(candidate);\n          setSelectedStepId(candidate.steps[0]?.id ?? null);\n          setMessage('Rascunho local restaurado.');\n        }\n      } catch {\n        window.localStorage.removeItem(storageKey);\n      }\n    }, 0);\n\n    return () => window.clearTimeout(restoreTimer);\n  }, [currentVersion, funnelId, storageKey]);'''
          if old_effect not in s:
              raise SystemExit('restore effect pattern not found')
          s = s.replace(old_effect, new_effect)
          old_mutate = '''  function mutate(recipe: (current: BuilderDraft) => BuilderDraft) {\n    if (effectiveReadOnly) return;\n    setDraft((current) => {\n      undoStack.current.push(cloneDraft(current));\n      if (undoStack.current.length > 50) undoStack.current.shift();\n      redoStack.current = [];\n      return recipe(current);\n    });\n    setMessage(null);\n    setError(null);\n  }'''
          new_mutate = '''  function mutate(recipe: (current: BuilderDraft) => BuilderDraft) {\n    if (effectiveReadOnly) return;\n    setUndoStack([...undoStack.slice(-49), cloneDraft(draft)]);\n    setRedoStack([]);\n    setDraft(recipe(draft));\n    setMessage(null);\n    setError(null);\n  }'''
          if old_mutate not in s:
              raise SystemExit('mutate pattern not found')
          s = s.replace(old_mutate, new_mutate)
          old_history = '''  function undo() {\n    const previous = undoStack.current.pop();\n    if (!previous) return;\n    redoStack.current.push(cloneDraft(draft));\n    setDraft(previous);\n  }\n\n  function redo() {\n    const next = redoStack.current.pop();\n    if (!next) return;\n    undoStack.current.push(cloneDraft(draft));\n    setDraft(next);\n  }'''
          new_history = '''  function undo() {\n    const previous = undoStack.at(-1);\n    if (!previous) return;\n    setUndoStack(undoStack.slice(0, -1));\n    setRedoStack([...redoStack, cloneDraft(draft)]);\n    setDraft(previous);\n  }\n\n  function redo() {\n    const next = redoStack.at(-1);\n    if (!next) return;\n    setRedoStack(redoStack.slice(0, -1));\n    setUndoStack([...undoStack, cloneDraft(draft)].slice(-50));\n    setDraft(next);\n  }'''
          if old_history not in s:
              raise SystemExit('history pattern not found')
          s = s.replace(old_history, new_history)
          s = s.replace('disabled={effectiveReadOnly || !undoStack.current.length}', 'disabled={effectiveReadOnly || undoStack.length === 0}')
          s = s.replace('disabled={effectiveReadOnly || !redoStack.current.length}', 'disabled={effectiveReadOnly || redoStack.length === 0}')
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/web/components/funnel-builder/FunnelBuilder.tsx
          pnpm exec eslint apps/web/components/funnel-builder/FunnelBuilder.tsx
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/funnel-builder/FunnelBuilder.tsx
          git commit -m "fix(epic13): use render-safe builder history state"
          git pull --rebase origin feature/epic-13-funnel-builder
          git push origin HEAD:feature/epic-13-funnel-builder
