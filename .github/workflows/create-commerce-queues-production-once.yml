name: Create Commerce Production Queues Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-commerce-queues-production-once.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-commerce-queues-production
  cancel-in-progress: false

jobs:
  create-commerce-queues:
    name: Create Commerce production Queues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate merged Queue names
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"queue": "funnel-analytics-commerce-production"' apps/commerce-worker/wrangler.jsonc
          grep -Fq '"dead_letter_queue": "funnel-analytics-commerce-dlq-production"' apps/commerce-worker/wrangler.jsonc
          grep -Fq '"queue": "funnel-analytics-commerce-production"' apps/journey-worker/wrangler.jsonc

      - name: Create missing production Queues
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            local queue_list
            queue_list="$(pnpm exec wrangler queues list)"

            if printf '%s\n' "$queue_list" | grep -Fq "$queue_name"; then
              echo "Queue already exists: $queue_name"
            else
              pnpm exec wrangler queues create "$queue_name"
            fi
          }

          ensure_queue funnel-analytics-commerce-production
          ensure_queue funnel-analytics-commerce-dlq-production

      - name: Confirm production Queues
        working-directory: apps/commerce-worker
        shell: bash
        run: |
          set -euo pipefail
          queue_list="$(pnpm exec wrangler queues list)"
          printf '%s\n' "$queue_list"
          printf '%s\n' "$queue_list" | grep -Fq 'funnel-analytics-commerce-production'
          printf '%s\n' "$queue_list" | grep -Fq 'funnel-analytics-commerce-dlq-production'
