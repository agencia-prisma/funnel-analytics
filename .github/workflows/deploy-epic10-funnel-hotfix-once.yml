name: Deploy EPIC 10 Funnel Hotfix Once

on:
  pull_request:
    paths:
      - .github/workflows/deploy-epic10-funnel-hotfix-once.yml

permissions:
  contents: read

jobs:
  deploy-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy Funnel Worker production from main
        working-directory: apps/funnel-worker
        run: pnpm exec wrangler deploy --env production

      - name: Tail fixed Funnel Worker and retrigger E2E journey
        shell: bash
        run: |
          set -euo pipefail

          (
            cd apps/funnel-worker
            timeout 50s pnpm exec wrangler tail --env production --format json > /tmp/funnel-tail.log 2>&1 || true
          ) &
          TAIL_PID=$!
          sleep 8

          BASE='https://funnel-analytics-collector-production.prismaag.workers.dev'
          ORIGIN='https://lp.prismaag.com.br'
          PIXEL_KEY='px_pub_5a53e35861b97c4584f39d5c670d03b99bda'
          VISITOR_ID='00000000-0000-7000-8000-000000000031'
          SESSION_ID='00000000-0000-7000-8000-000000000032'
          EVENT_ID='00000000-0000-7000-8000-000000000036'
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          PAYLOAD=$(cat <<JSON
          {
            "batch_version": 1,
            "sent_at": "$NOW",
            "events": [{
              "event_id": "$EVENT_ID",
              "event_name": "page_view",
              "event_version": 1,
              "sdk_version": "epic10-production-e2e/1.2",
              "pixel_key": "$PIXEL_KEY",
              "visitor_id": "$VISITOR_ID",
              "session_id": "$SESSION_ID",
              "occurred_at": "$NOW",
              "page_url": "https://lp.prismaag.com.br/epic10-funnel-e2e-step-2",
              "page_path": "/epic10-funnel-e2e-step-2",
              "page_title": "EPIC 10 Funnel E2E after hotfix",
              "referrer": null,
              "referrer_domain": null,
              "utm_source": null,
              "utm_medium": null,
              "utm_campaign": null,
              "utm_content": null,
              "utm_term": null,
              "click_ids": {},
              "device": {"type": "desktop"},
              "browser": {"name": "github-actions"},
              "os": {"name": "linux"},
              "screen": {"width": 1920, "height": 1080, "device_pixel_ratio": 1},
              "viewport": {"width": 1280, "height": 720},
              "language": "pt-BR",
              "timezone": "America/Sao_Paulo",
              "consent_state": "granted",
              "test_mode": true
            }]
          }
          JSON
          )

          STATUS="$(curl -sS -o /tmp/e2e-body -w '%{http_code}' -X POST "$BASE/v1/events" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" --data "$PAYLOAD")"
          cat /tmp/e2e-body
          echo
          echo "HTTP_STATUS=$STATUS"
          test "$STATUS" = '202'

          sleep 25
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo '===== FUNNEL WORKER TAIL ====='
          cat /tmp/funnel-tail.log || true

      - name: Show active production deployment
        working-directory: apps/funnel-worker
        run: pnpm exec wrangler deployments list --env production | sed -n '1,40p'
