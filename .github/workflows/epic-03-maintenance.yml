name: EPIC 03 Maintenance

on:
  push:
    branches:
      - feature/epic-03-pixel-browser-sdk

permissions:
  contents: write

concurrency:
  group: epic-03-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/epic-03-pixel-browser-sdk

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Show formatted validation workflow
        shell: bash
        run: |
          echo '---VALIDATION-YAML-BEGIN---'
          cat .github/workflows/validation.yml
          echo '---VALIDATION-YAML-END---'

      - name: Commit normalized non-workflow files
        shell: bash
        run: |
          git add             pnpm-lock.yaml             package.json             pnpm-workspace.yaml             packages/pixel             packages/event-contracts             tests/pixel             tests/fixtures             docs             playwright.pixel.config.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize EPIC 03 lockfile and formatting"
          git push origin HEAD:feature/epic-03-pixel-browser-sdk
