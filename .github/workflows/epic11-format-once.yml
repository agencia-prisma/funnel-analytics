name: EPIC 11 Format Once

on:
  push:
    branches:
      - feature/epic-11-commerce-purchase-foundation
    paths:
      - .github/workflows/epic11-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/epic-11-commerce-purchase-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format EPIC 11 files
        run: |
          pnpm exec prettier --write \
            apps/commerce-worker/src/consumer.test.ts \
            apps/commerce-worker/src/consumer.ts \
            apps/commerce-worker/src/envelope.test.ts \
            apps/commerce-worker/src/envelope.ts \
            apps/commerce-worker/src/integration.test.ts \
            apps/commerce-worker/src/repository.ts \
            apps/commerce-worker/wrangler.jsonc \
            apps/journey-worker/src/consumer.ts \
            apps/journey-worker/wrangler.jsonc \
            packages/commerce-engine/src/index.test.ts \
            packages/commerce-engine/src/index.ts
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Formatting already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/commerce-worker/src/consumer.test.ts \
            apps/commerce-worker/src/consumer.ts \
            apps/commerce-worker/src/envelope.test.ts \
            apps/commerce-worker/src/envelope.ts \
            apps/commerce-worker/src/integration.test.ts \
            apps/commerce-worker/src/repository.ts \
            apps/commerce-worker/wrangler.jsonc \
            apps/journey-worker/src/consumer.ts \
            apps/journey-worker/wrangler.jsonc \
            packages/commerce-engine/src/index.test.ts \
            packages/commerce-engine/src/index.ts
          git commit -m 'style: format EPIC 11'
          git push origin HEAD:feature/epic-11-commerce-purchase-foundation
